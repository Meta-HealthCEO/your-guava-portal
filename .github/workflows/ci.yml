name: Portal CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # GHSA-qwww-vcr4-c8h2 only affects React Router RSC/server-action mode.
      # This client-only BrowserRouter application does not use those APIs.
      - run: npm run audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Compile-time safety value only; deployments must provide their real API URL.
          VITE_API_URL: https://api.example.invalid/api
      - run: git diff --check
